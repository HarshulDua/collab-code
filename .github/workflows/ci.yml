name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build execution sandbox image
        run: docker build -t collab-python-sandbox:latest -f docker/python-sandbox.Dockerfile docker/

      - name: Run server test suite
        working-directory: server
        env:
          MONGO_URI: mongodb://localhost:27017/collab-ci
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-only-test-secret
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
