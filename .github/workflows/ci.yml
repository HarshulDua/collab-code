name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Lint server
        working-directory: server
        run: npm run lint

      - name: Build execution sandbox image
        run: docker build -t collab-sandbox:latest -f docker/sandbox.Dockerfile docker/

      - name: Run server test suite
        working-directory: server
        env:
          MONGO_URI: mongodb://localhost:27017/collab-ci
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-only-test-secret
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Build client
        working-directory: client
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  # The live deployment serves the client from the `client` container in
  # docker-compose.prod.yml, reverse-proxied by Caddy alongside the server —
  # not S3/CloudFront (see DEPLOYMENT.md's "Deployment topology" note). Both
  # rebuild together over the same SSH session so they stay in sync.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy server + client to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/collab-code
            git fetch origin main
            PREV=$(git rev-parse HEAD)
            git reset --hard origin/main

            # Reclaim first. The box is a t3.small with a 20GB disk and the
            # sandbox image alone is ~2.4GB — a deploy that starts with the
            # disk nearly full wedges the whole instance (sshd included), which
            # is exactly how this once took production down.
            docker container prune -f
            docker image prune -f
            docker builder prune -af --filter until=24h
            df -h / | tail -1

            # The sandbox image only changes when its Dockerfile does, and
            # rebuilding 2.4GB on every push is most of the memory and disk
            # pressure. Rebuild it only when it actually changed, or when it
            # is missing entirely.
            if ! docker image inspect collab-sandbox:latest >/dev/null 2>&1 \
               || ! git diff --quiet "$PREV" HEAD -- docker/sandbox.Dockerfile; then
              echo "sandbox image: rebuilding"
              docker build -t collab-sandbox:latest -f docker/sandbox.Dockerfile docker/
            else
              echo "sandbox image: unchanged, skipping rebuild"
            fi

            # Built one at a time: two concurrent Node builds do not fit in
            # 2GB of RAM alongside the running stack.
            docker compose -f docker-compose.prod.yml --env-file .env.prod build server
            docker compose -f docker-compose.prod.yml --env-file .env.prod build client
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d server client mongo redis

            docker image prune -f
            df -h / | tail -1
