name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build execution sandbox image
        run: docker build -t collab-python-sandbox:latest -f docker/python-sandbox.Dockerfile docker/

      - name: Run server test suite
        working-directory: server
        env:
          MONGO_URI: mongodb://localhost:27017/collab-ci
          REDIS_URL: redis://localhost:6379/1
          JWT_SECRET: ci-only-test-secret
        run: npm test

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  deploy-server:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy server to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/collab-code
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build server mongo redis
            docker image prune -f

  deploy-client:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [server, client]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client-dist

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync client-dist s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront (if configured)
        if: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
